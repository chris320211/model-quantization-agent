[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-agent"
version = "0.2.0"
description = "Skills for your own AI agent on a GPU: port any quantization method onto any model, measure vs fp16, publish beneficial runs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "huggingface_hub>=0.25",
    "pypdf>=4.0",
    "pyyaml>=6",
    "requests>=2.31",
    "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
